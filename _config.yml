# GitHub Pages builds this repo with Jekyll (there is no .nojekyll), so this
# exclude list is what keeps working files off the published site. Everything
# not listed is copied as-is; nothing here is processed or templated.
exclude:
  - PROJECT_NOTES.md
  - docs/
  - motion/
  - chat-worker/
  - tools/
  - tmp/
  - node_modules/
  - "tmp_*"
  - "*.md"
  - package.json
  - package-lock.json
